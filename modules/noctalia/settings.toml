config_version = 16

[bar]
order = [ "Main" ]

    [bar.Main]
    background_opacity = 0.64999998547136784
    center = [ "taskbar" ]
    end = [ "cpu", "network", "bluetooth", "volume", "clock" ]
    margin_edge = 5
    margin_ends = 12
    shadow = false
    start = [ "launcher", "active_window" ]
    thickness = 38
    widget_spacing = 12

[control_center]
circular_avatar = false
hidden_tabs = [ "monitor", "power", "weather", "calendar", "notifications", "screen-time" ]
show_avatar_border = false
sidebar = "full"
sidebar_section = "full"
width = 800

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "audio"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "Noto Sans"
settings_show_advanced = true

    [shell.launcher]
    app_grid = true
    categories = false
    layout = "simple"
    show_navigation_labels = false
    show_session_button = false
    show_settings_button = false

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    wallpaper_placement = "floating"

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4" ]

[wallpaper]
directory = "/home/meron/Pictures"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/meron/Pictures/train-girl.png"

    [wallpaper.last]
    path = "/home/meron/Pictures/train-girl.png"

    [wallpaper.monitors.DP-1]
    path = "/home/meron/Pictures/train-girl.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/meron/Pictures/train-girl.png"

[widget.bluetooth]
show_label = true

[widget.clock]
color = "primary"
format = "{:%A %H:%M}"

    [widget.clock.actions]
    left = "panel-toggle control-center"

[widget.cpu]
visualization = "none"

[widget.launcher]
glyph = "grid-dots"

[widget.taskbar]
capsule_radius = 8
empty_color = "on_surface_variant"
focused_color = "on_surface"
font_scale = 1.2
group_by_workspace = true
hide_empty_workspaces = true
inactive_opacity = 0.5
minimal = true
occupied_color = "on_surface_variant"
scale = 1.2
show_active_indicator = false
workspace_group_inactive_border_color = "#00000000"
workspace_label_placement = "inside"

[widget.workspaces]
focused_output_only = true
hide_when_empty = true
max_label_chars = 13